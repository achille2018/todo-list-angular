<li [class.done]="todo().completed">
  <input type="checkbox" [checked]="todo().completed" (change)="toggle.emit()" />

  <span
    class="title"
    title="Double-cliquez pour modifier"
    [appInlineEdit]="todo().title"
    (edited)="rename.emit($event)"
  >{{ todo().title }}</span>

  <select
    #prioritySelect
    [class]="'priority ' + (todo().priority || 'medium')"
    aria-label="Priorité"
    (change)="onPriorityChange(prioritySelect)"
  >
    <option value="high" [selected]="todo().priority === 'high'">Haute</option>
    <option value="medium" [selected]="!todo().priority || todo().priority === 'medium'">Moyenne</option>
    <option value="low" [selected]="todo().priority === 'low'">Basse</option>
  </select>

  <button type="button" class="delete" aria-label="Supprimer" (click)="onDelete()">×</button>
</li>
