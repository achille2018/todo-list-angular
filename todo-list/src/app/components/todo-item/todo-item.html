<article class="todo" [class.done]="todo().completed" [attr.data-priority]="priority()">
  <button
    type="button"
    class="check"
    role="checkbox"
    [attr.aria-checked]="todo().completed"
    [attr.aria-label]="todo().completed ? 'Marquer comme en cours' : 'Marquer comme terminée'"
    (click)="toggle.emit()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" /></svg>
  </button>

  <div class="content">
    <span
      class="title"
      title="Double-cliquez pour modifier"
      [appInlineEdit]="todo().title"
      (edited)="rename.emit($event)"
    >{{ todo().title }}</span>

    <div class="meta">
      <button
        type="button"
        class="badge"
        (click)="cyclePriority()"
        [title]="'Priorité ' + priorityLabel().toLowerCase() + ' — cliquer pour changer'"
      >
        <span class="dot"></span>{{ priorityLabel() }}
      </button>
      @if (todo().createdAt) {
        <span class="date">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M12 8v4l2.5 2" /></svg>
          {{ todo().createdAt | relativeTime }}
        </span>
      }
    </div>
  </div>

  <button type="button" class="delete" aria-label="Supprimer la tâche" title="Supprimer" (click)="remove.emit()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" />
    </svg>
  </button>
</article>
