<header>
  <div class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" /></svg>
      </div>
      <div>
        <h1>TODO LIST</h1>
        <p class="date">{{ today }}</p>
      </div>
    </div>

    <button
      type="button"
      class="theme-toggle"
      [class.dark]="theme() === 'dark'"
      (click)="toggleTheme()"
      [attr.aria-label]="theme() === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre'"
      [title]="theme() === 'dark' ? 'Mode clair' : 'Mode sombre'"
    >
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
      </svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </svg>
    </button>
  </div>

  <ul class="team" aria-label="Étudiant">
    @for (student of students; track $index) {
      <li>
        <span class="avatar">{{ initials(student) }}</span>
        <span class="who">
          <span class="name">{{ student.firstName }} {{ student.lastName }}</span>
          <span class="role">Étudiant</span>
        </span>
      </li>
    }
  </ul>
</header>
