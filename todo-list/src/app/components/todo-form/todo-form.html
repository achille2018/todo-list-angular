<div class="composer" [class.shake]="shake()">
  <div class="field" [attr.data-priority]="priority()">
    <svg class="plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
    <input
      #taskInput
      type="text"
      maxlength="200"
      placeholder="Ajouter une tâche…"
      aria-label="Nouvelle tâche"
      (keydown.enter)="submit(taskInput)"
    />
    <button type="button" class="add" (click)="submit(taskInput)">
      Ajouter
      <kbd>↵</kbd>
    </button>
  </div>

  <div class="priority-picker" role="radiogroup" aria-label="Priorité de la nouvelle tâche">
    <span class="label">Priorité</span>
    @for (p of priorities; track p) {
      <button
        type="button"
        role="radio"
        [class]="'chip ' + p"
        [class.selected]="priority() === p"
        [attr.aria-checked]="priority() === p"
        (click)="priority.set(p)"
      >
        <span class="dot"></span>{{ labels[p] }}
      </button>
    }
  </div>
</div>
