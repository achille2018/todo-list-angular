<div class="form">
  <input
    #taskInput
    type="text"
    placeholder="Nouvelle tâche…"
    (keydown.enter)="submit(taskInput, prioritySelect)"
  />

  <select #prioritySelect aria-label="Priorité">
    <option value="high">Haute</option>
    <option value="medium" selected>Moyenne</option>
    <option value="low">Basse</option>
  </select>

  <button type="button" (click)="submit(taskInput, prioritySelect)">Ajouter</button>
</div>
