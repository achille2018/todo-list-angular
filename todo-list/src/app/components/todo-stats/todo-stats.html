<section class="stats" [class.complete]="allDone()">
  <div class="ring" role="img" [attr.aria-label]="percent() + ' % des tâches terminées'">
    <svg viewBox="0 0 72 72" aria-hidden="true">
      <defs>
        <linearGradient id="ring-gradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="var(--primary)" />
          <stop offset="100%" stop-color="var(--primary-2)" />
        </linearGradient>
      </defs>
      <circle class="track" cx="36" cy="36" [attr.r]="radius" />
      <circle
        class="progress"
        cx="36"
        cy="36"
        [attr.r]="radius"
        [attr.stroke-dasharray]="circumference"
        [attr.stroke-dashoffset]="dashOffset()"
      />
    </svg>
    <span class="percent">{{ percent() }}<small>%</small></span>

    @if (allDone()) {
      <div class="confetti" aria-hidden="true">
        @for (i of confetti; track i) {
          <span [style]="'--i:' + i"></span>
        }
      </div>
    }
  </div>

  <div class="summary">
    <p class="message">{{ message() }}</p>
    <p class="detail">{{ counts().done }} sur {{ counts().all }} tâche(s) terminée(s)</p>

    <ul class="chips">
      <li class="chip active"><strong>{{ counts().active }}</strong> en cours</li>
      <li class="chip done"><strong>{{ counts().done }}</strong> terminée(s)</li>
      <li class="chip urgent" [class.pulse]="counts().urgent > 0">
        <strong>{{ counts().urgent }}</strong> urgente(s)
      </li>
    </ul>
  </div>
</section>
