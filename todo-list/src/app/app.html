<main class="container">
  <app-header />

  <app-todo-form (add)="addTodo($event)" />
  <app-todo-filter [current]="filter()" />

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <app-todo-list
    [todos]="sortedTodos()"
    (toggle)="toggleTodo($event)"
    (rename)="renameTodo($event)"
    (remove)="deleteTodo($event)"
  />

  <app-footer [count]="todos().length" [remaining]="remaining()" />
</main>
